# ============================================================
# PriceWise — Docker Compose 一键部署
# ============================================================
# 使用方法:
#   docker-compose up -d              # 启动全部服务
#   docker-compose down               # 停止全部服务
#   docker-compose logs -f api        # 查看 API 日志
# ============================================================

version: '3.8'

services:
  # ───────────────────────────────────────
  # 1. MySQL 8.0 — 分析结果数据库
  # ───────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: pricing-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: smart_pricing
      MYSQL_USER: pricing_api
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pricing_api_2026}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../data/sql/01-create-database.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pricing-network

  # ───────────────────────────────────────
  # 2. Spring Boot API — REST 服务
  # ───────────────────────────────────────
  api:
    build:
      context: ../pricing-server
      dockerfile: ../docker/Dockerfile.api
    container_name: pricing-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smart_pricing?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8mb4
      MYSQL_USER: pricing_api
      MYSQL_PASS: ${MYSQL_PASSWORD:-pricing_api_2026}
      JWT_SECRET: ${JWT_SECRET:-SmartPricingEngine-JWT-SecretKey-2026-Must-Be-At-Least-256-Bits-Long!!}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost}
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - pricing-network

  # ───────────────────────────────────────
  # 3. Nginx — Dashboard 静态服务 + API 代理
  # ───────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: pricing-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ../dashboard:/usr/share/nginx/html/dashboard:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - pricing-network

volumes:
  mysql-data:
    driver: local

networks:
  pricing-network:
    driver: bridge
