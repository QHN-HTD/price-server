# ============================================================
# PriceWise — Spring Boot 配置
# ============================================================
# 安全提示：生产环境应将敏感配置移入环境变量或 Vault
# ============================================================

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: smart-pricing-engine

  # ── 数据源配置 ──
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:smart_pricing}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${MYSQL_USER:pricing_api}
    password: ${MYSQL_PASS:pricing_api_2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 10000
      max-lifetime: 600000
      # 安全：验证连接有效性，防止连接泄漏
      connection-test-query: SELECT 1

  # ── Jackson 序列化配置 ──
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: UTC
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# ── MyBatis 配置 ──
mybatis:
  mapper-locations: classpath:mybatis/mapper/*.xml
  type-aliases-package: com.pricing.server.model.entity
  configuration:
    map-underscore-to-camel-case: true
    # 安全：SQL 日志在生产环境应关闭（防敏感信息泄露）
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# ── JWT 配置 ──
jwt:
  secret: ${JWT_SECRET:SmartPricingEngine-JWT-SecretKey-2026-Must-Be-At-Least-256-Bits-Long!!}
  expiration: 1800000  # 30 分钟（毫秒）
  issuer: smart-pricing-engine

# ── 限流配置 ──
rate-limit:
  enabled: true
  permits-per-minute: 100            # 全局限流：100次/分钟
  login-permits-per-minute: 5        # 登录接口：5次/分钟（防暴力破解）

# ── 安全配置 ──
security:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:63342}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,X-Requested-With
    max-age: 3600
  xss:
    enabled: true                     # XSS 过滤器开关
  csp:
    enabled: true                     # Content-Security-Policy 响应头

# ── 审计日志配置 ──
audit:
  enabled: true
  # 排除的路径（不记录审计日志）
  exclude-paths:
    - /api/v1/actuator/health
    - /api/v1/auth/login.html
  # 敏感参数的关键词过滤（替换为 ***）
  sensitive-keywords:
    - password
    - token
    - secret

# ── 管理端点 ──
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized

# ── 日志配置 ──
logging:
  level:
    root: INFO
    com.pricing.server: DEBUG
    org.springframework.security: INFO
    # 审计日志单独输出
    audit: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
